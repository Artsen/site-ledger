name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Configure disposable backend storage
        run: |
          echo "SCANNER_DATABASE_URL=sqlite:///$RUNNER_TEMP/site-ledger-ci.db" >> "$GITHUB_ENV"
          echo "SCANNER_HTML_STORAGE_ROOT=$RUNNER_TEMP/site-ledger-html" >> "$GITHUB_ENV"
          echo "SCANNER_AI_DOCUMENT_STORAGE_ROOT=$RUNNER_TEMP/site-ledger-ai-documents" >> "$GITHUB_ENV"
          echo "SCANNER_RENDERED_ARTIFACT_STORAGE_ROOT=$RUNNER_TEMP/site-ledger-rendered" >> "$GITHUB_ENV"
      - name: Verify backend lockfile
        run: uv lock --check
      - name: Sync backend dependencies
        run: uv sync --extra dev --locked
      - name: Install backend Chromium
        run: uv run --extra dev --locked playwright install --with-deps chromium
      - name: Run backend tests
        run: uv run --extra dev --locked pytest
      - name: Run Ruff
        run: uv run --extra dev --locked ruff check . ../tools
      - name: Check Ruff formatting
        run: uv run --extra dev --locked ruff format --check . ../tools
      - name: Run strict MyPy
        run: uv run --extra dev --locked mypy app
      - name: Upgrade a fresh database
        run: uv run --extra dev --locked alembic upgrade head
      - name: Check migration-model consistency
        run: uv run --extra dev --locked alembic check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit production dependencies at high severity
        run: npm audit --omit=dev --audit-level=high
      - name: Report all dependency advisories
        continue-on-error: true
        run: npm audit
      - name: Run ESLint
        run: npm run lint
      - name: Run TypeScript checks
        run: npm run typecheck
      - name: Run frontend tests
        run: npm run test
      - name: Build frontend
        run: npm run build

  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npm run e2e
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  golden-path:
    name: Golden Path
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Sync backend dependencies
        working-directory: backend
        run: uv sync --extra dev --locked
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run disposable full-stack Golden Path
        run: uv run --project backend --extra dev --locked python tools/run_full_stack_e2e.py --artifacts-dir golden-path-artifacts
      - name: Upload Golden Path failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: golden-path-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: golden-path-artifacts/
          if-no-files-found: ignore
          retention-days: 7
